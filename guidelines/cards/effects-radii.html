<!DOCTYPE html><html lang="en"><head><meta charset="utf-8" /><link rel="stylesheet" href="../../styles.css" /><style>html,body{margin:0;background:var(--surface-app);font-family:var(--font-sans);color:var(--text-hi)}.pad{padding:20px 22px}.lbl{font-size:9px;font-weight:700;letter-spacing:var(--ls-label);text-transform:uppercase;color:var(--text-low)}.mono{font-family:var(--font-mono)}</style></head><body class="pad"><div style="display:flex;gap:14px">
<div style="flex:1;min-width:0"><div style="height:48px;background:var(--surface-control);border:1px solid var(--line-strong);border-radius:2px"></div><div class="mono" style="font-size:10px;color:var(--text-hi);margin-top:7px">--radius-xs</div><div class="mono" style="font-size:10px;color:var(--text-low)">2px</div></div><div style="flex:1;min-width:0"><div style="height:48px;background:var(--surface-control);border:1px solid var(--line-strong);border-radius:3px"></div><div class="mono" style="font-size:10px;color:var(--text-hi);margin-top:7px">--radius-sm</div><div class="mono" style="font-size:10px;color:var(--text-low)">3px</div></div><div style="flex:1;min-width:0"><div style="height:48px;background:var(--surface-control);border:1px solid var(--line-strong);border-radius:5px"></div><div class="mono" style="font-size:10px;color:var(--text-hi);margin-top:7px">--radius-md</div><div class="mono" style="font-size:10px;color:var(--text-low)">5px</div></div><div style="flex:1;min-width:0"><div style="height:48px;background:var(--surface-control);border:1px solid var(--line-strong);border-radius:8px"></div><div class="mono" style="font-size:10px;color:var(--text-hi);margin-top:7px">--radius-lg</div><div class="mono" style="font-size:10px;color:var(--text-low)">8px</div></div><div style="flex:1;min-width:0"><div style="height:48px;background:var(--surface-control);border:1px solid var(--line-strong);border-radius:999px"></div><div class="mono" style="font-size:10px;color:var(--text-hi);margin-top:7px">--radius-pill</div><div class="mono" style="font-size:10px;color:var(--text-low)">999px</div></div>
</div></body></html>
