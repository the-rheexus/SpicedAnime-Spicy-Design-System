<!-- @dsCard group="Effects" viewport="700x200" name="Diagonal stripes — density" subtitle="One shared 135° axis. Medium for panel headers, wide for empty states; fine and hazard need text-free areas." -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8" /><link rel="stylesheet" href="../../styles.css" /><style>html,body{margin:0;background:var(--surface-app);font-family:var(--font-sans);color:var(--text-hi)}.pad{padding:20px 22px}.lbl{font-size:9px;font-weight:700;letter-spacing:var(--ls-label);text-transform:uppercase;color:var(--text-low)}.mono{font-family:var(--font-mono)}.cap{font-family:var(--font-mono);font-size:10px;color:var(--text-low);margin-top:8px}.sub{font-size:10px;color:var(--text-faint);margin-top:2px}</style></head><body class="pad"><div style="display:flex;gap:12px">
<div style="flex:1;min-width:0"><div style="height:96px;background-color:var(--surface-card);background-image:var(--tex-stripe-fine);border:1px solid var(--line);border-radius:var(--radius-md)"></div><div class="cap">--tex-stripe-fine</div><div class="sub">Safe under content</div></div><div style="flex:1;min-width:0"><div style="height:96px;background-color:var(--surface-card);background-image:var(--tex-stripe-medium);border:1px solid var(--line);border-radius:var(--radius-md)"></div><div class="cap">--tex-stripe-medium</div><div class="sub">Panel headers, rails</div></div><div style="flex:1;min-width:0"><div style="height:96px;background-color:var(--surface-card);background-image:var(--tex-stripe-wide);border:1px solid var(--line);border-radius:var(--radius-md)"></div><div class="cap">--tex-stripe-wide</div><div class="sub">Empty states, large fills</div></div><div style="flex:1;min-width:0"><div style="height:96px;background-color:var(--surface-card);background-image:var(--tex-stripe-hazard);border:1px solid var(--line);border-radius:var(--radius-md)"></div><div class="cap">--tex-stripe-hazard</div><div class="sub">Loudest — small areas only</div></div><div style="flex:1;min-width:0"><div style="height:96px;background-color:var(--surface-card);background-image:var(--tex-stripe-spice);border:1px solid var(--line);border-radius:var(--radius-md)"></div><div class="cap">--tex-stripe-spice</div><div class="sub">Decorative emphasis only</div></div>
</div></body></html>
