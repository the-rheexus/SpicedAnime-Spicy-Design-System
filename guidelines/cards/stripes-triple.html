<!DOCTYPE html><html lang="en"><head><meta charset="utf-8" /><link rel="stylesheet" href="../../styles.css" /><style>html,body{margin:0;background:var(--surface-app);font-family:var(--font-sans);color:var(--text-hi)}.pad{padding:20px 22px}.lbl{font-size:9px;font-weight:700;letter-spacing:var(--ls-label);text-transform:uppercase;color:var(--text-low)}.mono{font-family:var(--font-mono)}.cap{font-family:var(--font-mono);font-size:10px;color:var(--text-low);margin-top:8px}.sub{font-size:10px;color:var(--text-faint);margin-top:2px}</style></head><body class="pad">
<div style="height:70px;background-color:var(--surface-card);background-image:var(--tex-stripe-triple);border:1px solid var(--line);border-radius:var(--radius-md)"></div>
<div class="cap">--tex-stripe-triple · full-width band</div>
<div style="display:flex;gap:12px;margin-top:16px">
  <div style="flex:1"><div style="height:76px;background:var(--surface-card);border:1px solid var(--line);border-radius:var(--radius-md);overflow:hidden;display:flex"><span style="width:104px;flex:none;background-image:var(--tex-stripe-triple)"></span><span style="flex:1;display:flex;align-items:center;padding:0 14px;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text-mid)">Corner mark</span></div><div class="cap">Clipped to a leading block</div></div>
  <div style="flex:1"><div style="height:76px;background:var(--surface-card);border:1px solid var(--line);border-radius:var(--radius-md);overflow:hidden;position:relative"><span style="position:absolute;inset:0;background-image:var(--tex-stripe-triple);-webkit-mask-image:linear-gradient(100deg,#000 0 34%,transparent 62%);mask-image:linear-gradient(100deg,#000 0 34%,transparent 62%)"></span><span style="position:relative;display:flex;align-items:center;height:100%;padding:0 14px;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text-mid)">Faded into surface</span></div><div class="cap">Masked so it decays, no hard seam</div></div>
</div></body></html>
