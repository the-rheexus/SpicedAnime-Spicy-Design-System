<!DOCTYPE html><html lang="en"><head><meta charset="utf-8" /><link rel="stylesheet" href="../../styles.css" /><style>html,body{margin:0;background:var(--surface-app);font-family:var(--font-sans);color:var(--text-hi)}.pad{padding:20px 22px}.lbl{font-size:9px;font-weight:700;letter-spacing:var(--ls-label);text-transform:uppercase;color:var(--text-low)}.mono{font-family:var(--font-mono)}</style></head><body class="pad"><div style="display:flex;gap:12px;align-items:flex-start">
<div style="flex:1;min-width:0"><div style="height:38px;background:var(--spice-500);color:#120A07;border-radius:var(--radius-md);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;transform:none;">Generate</div><div class="mono" style="font-size:10px;color:var(--text-low);margin-top:9px">Idle</div></div><div style="flex:1;min-width:0"><div style="height:38px;background:var(--spice-600);color:#120A07;border-radius:var(--radius-md);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;transform:none;">Generate</div><div class="mono" style="font-size:10px;color:var(--text-low);margin-top:9px">Hover</div></div><div style="flex:1;min-width:0"><div style="height:38px;background:var(--spice-700);color:#120A07;border-radius:var(--radius-md);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;transform:translateY(1px);">Generate</div><div class="mono" style="font-size:10px;color:var(--text-low);margin-top:9px">Press</div></div><div style="flex:1;min-width:0"><div style="height:38px;background:var(--spice-500);color:#120A07;border-radius:var(--radius-md);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;transform:none;box-shadow:0 0 0 2px var(--ink-900),0 0 0 4px rgba(255,77,46,.55);">Generate</div><div class="mono" style="font-size:10px;color:var(--text-low);margin-top:9px">Focus</div></div>
<div style="flex:1;min-width:0"><div style="height:38px;background:var(--ink-700);color:var(--text-faint);border:1px solid var(--line);border-radius:var(--radius-md);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase">Generate</div><div class="mono" style="font-size:10px;color:var(--text-low);margin-top:9px">Disabled</div></div>
</div></body></html>
