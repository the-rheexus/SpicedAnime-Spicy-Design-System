<!-- @dsCard group="Exploration" viewport="700x230" name="Layered textures" subtitle="Dots stay in play as an alternative — stack via a comma-separated background-image, stripes first" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8" /><link rel="stylesheet" href="../../styles.css" /><style>html,body{margin:0;background:var(--surface-app);font-family:var(--font-sans);color:var(--text-hi)}.pad{padding:20px 22px}.lbl{font-size:9px;font-weight:700;letter-spacing:var(--ls-label);text-transform:uppercase;color:var(--text-low)}.mono{font-family:var(--font-mono)}.cap{font-family:var(--font-mono);font-size:10px;color:var(--text-low);margin-top:8px}.sub{font-size:10px;color:var(--text-faint);margin-top:2px}</style></head><body class="pad"><div style="display:flex;gap:12px">
<div style="flex:1;min-width:0"><div style="height:104px;background-color:var(--surface-card);background-image:url('../../assets/halftone-tile.png');border:1px solid var(--line);border-radius:var(--radius-md)"></div><div class="cap">Halftone alone</div><div class="sub">--tex-halftone</div></div><div style="flex:1;min-width:0"><div style="height:104px;background-color:var(--surface-card);background-image:url('../../assets/hatch-tile.png');border:1px solid var(--line);border-radius:var(--radius-md)"></div><div class="cap">Hatch alone</div><div class="sub">--tex-hatch</div></div><div style="flex:1;min-width:0"><div style="height:104px;background-color:var(--surface-card);background-image:var(--tex-stripe-fine), url('../../assets/halftone-tile.png');border:1px solid var(--line);border-radius:var(--radius-md)"></div><div class="cap">Halftone + fine</div><div class="sub">stripe over dots</div></div><div style="flex:1;min-width:0"><div style="height:104px;background-color:var(--surface-card);background-image:var(--tex-stripe-wide), url('../../assets/hatch-tile.png');border:1px solid var(--line);border-radius:var(--radius-md)"></div><div class="cap">Hatch + wide</div><div class="sub">crosshatch effect</div></div><div style="flex:1;min-width:0"><div style="height:104px;background-color:var(--surface-card);background-image:var(--tex-stripe-triple), url('../../assets/halftone-tile.png');border:1px solid var(--line);border-radius:var(--radius-md)"></div><div class="cap">Triple + halftone</div><div class="sub">band over dots</div></div>
</div>
<div class="cap" style="margin-top:12px">Stripes go FIRST in the list so they sit above the dot tile. Two layers is the ceiling — three reads as noise.</div></body></html>
