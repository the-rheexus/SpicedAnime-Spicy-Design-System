<!-- @dsCard group="Effects" viewport="700x150" name="Motion" subtitle="Fast and mechanical — no bounce, no spring, no page transitions" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8" /><link rel="stylesheet" href="../../styles.css" /><style>html,body{margin:0;background:var(--surface-app);font-family:var(--font-sans);color:var(--text-hi)}.pad{padding:20px 22px}.lbl{font-size:9px;font-weight:700;letter-spacing:var(--ls-label);text-transform:uppercase;color:var(--text-low)}.mono{font-family:var(--font-mono)}</style></head><body class="pad"><div style="display:flex;gap:26px">
<div><div class="mono" style="font-size:13px;color:var(--text-hi)">110ms</div><div class="mono" style="font-size:10px;color:var(--text-low);margin-top:3px">--dur-fast</div><div style="font-size:10px;color:var(--text-faint);margin-top:2px">hover, press, chevron</div></div>
<div><div class="mono" style="font-size:13px;color:var(--text-hi)">170ms</div><div class="mono" style="font-size:10px;color:var(--text-low);margin-top:3px">--dur-base</div><div style="font-size:10px;color:var(--text-faint);margin-top:2px">border, tint</div></div>
<div><div class="mono" style="font-size:13px;color:var(--text-hi)">240ms</div><div class="mono" style="font-size:10px;color:var(--text-low);margin-top:3px">--dur-slow</div><div style="font-size:10px;color:var(--text-faint);margin-top:2px">modal scrim</div></div>
<div style="flex:1"><div class="mono" style="font-size:11px;color:var(--text-hi)">cubic-bezier(.2,.7,.3,1)</div><div class="mono" style="font-size:10px;color:var(--text-low);margin-top:3px">--ease-out</div><div class="mono" style="font-size:11px;color:var(--text-hi);margin-top:8px">cubic-bezier(.4,0,.2,1)</div><div class="mono" style="font-size:10px;color:var(--text-low);margin-top:3px">--ease-standard</div></div>
<div style="flex:1"><div style="font-size:10px;color:var(--text-low);text-transform:uppercase;letter-spacing:.12em">Keyframes</div><div class="mono" style="font-size:11px;color:var(--text-mid);margin-top:6px">sa-spin</div><div class="mono" style="font-size:11px;color:var(--text-mid)">sa-pulse</div><div class="mono" style="font-size:11px;color:var(--text-mid)">sa-shimmer</div></div>
</div></body></html>
