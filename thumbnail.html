<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8" /><link rel="stylesheet" href="styles.css" />
<style>html,body{margin:0;width:1280px;height:854px;overflow:hidden}.tile{display:grid;grid-template-columns:1fr 190px;width:1280px;height:854px}.main{background:var(--spice-500);display:flex;align-items:center;justify-content:center}.main img{width:520px;height:520px;display:block}.strip{display:grid;grid-template-rows:repeat(4,1fr);height:854px}.strip span{display:block;width:100%;height:100%}</style>
</head><body>
<div class="tile"><div class="main"><img src="assets/spicedanime-icon.png" alt="SpicedAnime" /></div><div class="strip"><span style="background:#E0A62E"></span><span style="background:#F0803C"></span><span style="background:#4CBF74"></span><span style="background:#6FA0F5"></span></div></div>
</body></html>
