<!-- @dsCard group="Components" viewport="900x640" name="Feedback — Alerts, Empty, Loading, Deferred, Modal" subtitle="ErrorAlert, EmptyState, LoadingState, DeferredPanel, ConfirmModal" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  body { margin:0; background:var(--ink-900); font-family:var(--font-sans); padding:24px; color:var(--text-hi); }
  .eyebrow { font-size:10px; font-weight:700; letter-spacing:var(--ls-label); text-transform:uppercase; color:var(--text-low); margin:0 0 12px; }
  .sec { margin-bottom:26px; }
  .two { display:grid; grid-template-columns:1fr 1fr; gap:20px; align-items:start; }
  .stack { display:flex; flex-direction:column; gap:12px; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
  const NS = window.SpicedAnimeSpicyDesignSystem_daab0d;
  const { ErrorAlert, EmptyState, LoadingState, DeferredPanel, ConfirmModal, Button, Icon } = NS;
  function Demo(){
    const [open,setOpen]=React.useState(false);
    return (
      <div>
        <div className="sec">
          <p className="eyebrow">Alerts</p>
          <div className="stack">
            <ErrorAlert tone="error" title="PPTX generation failed" action={<Button variant="danger" size="sm" iconLeft={<Icon name="refresh-cw" size={13}/>}>Retry</Button>}>The print service timed out. Your batch is unchanged.</ErrorAlert>
            <ErrorAlert tone="warning" title="3 items blocked" onDismiss={()=>{}}>Missing artwork on 3 SKUs in this batch.</ErrorAlert>
            <ErrorAlert tone="success" title="Packing CSV exported">46 orders written to packing-2026-06-19.csv.</ErrorAlert>
          </div>
        </div>

        <div className="sec">
          <p className="eyebrow">Empty &amp; Loading</p>
          <div className="two">
            <EmptyState icon="layers" title="No open batches" action={<Button variant="primary" iconLeft={<Icon name="plus" size={14}/>}>New Batch</Button>}>New batches appear here once orders are grouped for production.</EmptyState>
            <div className="stack">
              <LoadingState variant="skeleton" rows={4} logoSrc={'../../assets/spicedanime-logo-spinner.png'}/>
              <div style={{border:'1px solid var(--line)', borderRadius:5, background:'var(--surface-card)'}}><LoadingState label="Generating PPTX…" logoSrc={'../../assets/spicedanime-logo-spinner.png'}/></div>
            </div>
          </div>
        </div>

        <div className="sec">
          <p className="eyebrow">Deferred &amp; Modal</p>
          <div className="two">
            <DeferredPanel title="Bulk reprint" eta="v1.2">Selecting multiple batches for a single reprint run is planned for a later release.</DeferredPanel>
            <div style={{display:'flex',alignItems:'center',justifyContent:'center',minHeight:140,border:'1px dashed var(--line-strong)',borderRadius:5}}>
              <Button variant="secondary" onClick={()=>setOpen(true)} iconLeft={<Icon name="lock" size={15}/>}>Preview Confirm Modal</Button>
            </div>
          </div>
        </div>

        <ConfirmModal open={open} tone="warning" title="Lock batch for review?" confirmLabel="Lock Batch" onCancel={()=>setOpen(false)} onConfirm={()=>setOpen(false)}>
          Locked batches can't accept new items until unlocked. You can still generate print files.
        </ConfirmModal>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script>
</body>
</html>
