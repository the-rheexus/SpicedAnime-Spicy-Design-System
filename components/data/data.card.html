<!-- @dsCard group="Components" viewport="900x720" name="Data — Metrics, Batch Card, Table, Filters" subtitle="MetricCard, BatchCard, DataTable, FilterBar" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  body { margin:0; background:var(--ink-900); font-family:var(--font-sans); padding:24px; color:var(--text-hi); }
  .eyebrow { font-size:10px; font-weight:700; letter-spacing:var(--ls-label); text-transform:uppercase; color:var(--text-low); margin:0 0 12px; }
  .sec { margin-bottom:28px; }
  .metrics { display:grid; grid-template-columns:repeat(4,1fr); gap:16px; }
  .batchrow { display:grid; grid-template-columns:1fr 1fr; gap:16px; max-width:760px; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
  const NS = window.SpicedAnimeSpicyDesignSystem_daab0d;
  const { MetricCard, BatchCard, DataTable, FilterBar, StatusBadge, Button, Icon } = NS;
  function Demo(){
    const [sel,setSel]=React.useState(['ORD-1042']);
    const [f,setF]=React.useState('all');
    const rows=[
      {id:'ORD-1042', sku:'SA-TAP-ONEPIECE-01', qty:3, status:'Ready'},
      {id:'ORD-1043', sku:'SA-GRD-NARUTO-02', qty:1, status:'Blocked'},
      {id:'ORD-1044', sku:'SA-PIL-JJK-GOJO', qty:5, status:'In Production'},
      {id:'ORD-1045', sku:'SA-TOTE-CHOSO-01', qty:2, status:'Being Packaged'},
    ];
    return (
      <div>
        <div className="sec">
          <p className="eyebrow">MetricCard</p>
          <div className="metrics">
            <MetricCard label="Open batches" value="12" icon="layers" accent hint="awaiting print"/>
            <MetricCard label="Units in production" value="1,284" unit="u" icon="boxes" delta="+8%" trend="up"/>
            <MetricCard label="Blocked items" value="3" icon="octagon-x" delta="needs review" trend="down"/>
            <MetricCard label="Shipped today" value="46" icon="truck" delta="+12" trend="up"/>
          </div>
        </div>

        <div className="sec">
          <p className="eyebrow">BatchCard</p>
          <div className="batchrow">
            <BatchCard batchId="BATCH-0428" title="One Piece Tapestries" status="In Production" units={142} printed={96} ordersCount={38} blocked={2} due="Jun 21"/>
            <BatchCard batchId="BATCH-0429" title="JJK Gojo Pillow Covers" status="Locked for Review" units={64} printed={28} ordersCount={21} due="Jun 23"/>
          </div>
        </div>

        <div className="sec">
          <p className="eyebrow">FilterBar + DataTable</p>
          <div style={{maxWidth:760, display:'flex', flexDirection:'column', gap:14}}>
            <FilterBar
              searchValue="" onSearch={()=>{}} searchPlaceholder="Search orders…"
              filters={[{value:'all',label:'All',count:42},{value:'ready',label:'Ready',count:18},{value:'blocked',label:'Blocked',count:3}]}
              activeFilter={f} onFilter={setF} onClear={()=>{setF('all');}}
              right={<Button variant="primary" size="sm" iconLeft={<Icon name="download" size={14}/>}>Export CSV</Button>}
            />
            <DataTable
              selectable selected={sel} onSelect={setSel} rowKey="id"
              columns={[
                {key:'id', header:'Order', mono:true, sortable:true},
                {key:'sku', header:'SKU', mono:true},
                {key:'qty', header:'Qty', align:'right', mono:true, sortable:true},
                {key:'status', header:'Status', render:(v)=> <StatusBadge status={v} size="sm"/>},
              ]}
              rows={rows}
              sortKey="qty" sortDir="desc"
            />
          </div>
        </div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script>
</body>
</html>
